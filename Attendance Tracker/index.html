<!DOCTYPE html>
<html>
<head>
    <title>Attendance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Attendance Tracker</h1>


        <!-- Register Trainee -->
        <div class="section">

            <h2>Register Trainee</h2>

            <form>

                <label>Trainee ID</label>
                <input type="text" name="trainee_id">

                <label>Trainee Name</label>
                <input type="text" name="trainee_name">

                <button type="submit">Register Trainee</button>

            </form>

        </div>


        <!-- Mark Attendance -->
        <div class="section">

            <h2>Mark Attendance</h2>

            <label>Select Date</label>
            <input type="date" name="attendance_date">


            <table>

                <thead>
                    <tr>
                        <th>Trainee ID</th>
                        <th>Trainee Name</th>
                        <th>Present</th>
                        <th>Absent</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- Backend will add trainees here -->
                </tbody>

            </table>

            <button type="button">Save Attendance</button>

        </div>


        <!-- Attendance Report -->
        <div class="section">

            <h2>Attendance Report</h2>

            <table>

                <thead>
                    <tr>
                        <th>Trainee ID</th>
                        <th>Trainee Name</th>
                        <th>Total Days</th>
                        <th>Present</th>
                        <th>Absent</th>
                        <th>Attendance %</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- Backend will add attendance report here -->
                </tbody>

            </table>

            <button type="button">Export Report</button>

        </div>

    </div>

</body>
</html>
